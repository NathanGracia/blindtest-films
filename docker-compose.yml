services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - DATABASE_URL=file:/app/prisma/prod.db
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3000}
      - IMPORT_API_TOKEN=${ADMIN_PASSWORD:-admin123}
    volumes:
      # Persister les fichiers media (optionnel si vous voulez les garder entre redemarrages)
      - audio_data:/app/public/audio
      - images_data:/app/public/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  audio_data:
  images_data:
