services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SHARED_SESSION_SECRET=${SHARED_SESSION_SECRET}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - DATABASE_URL=file:/app/prisma/dev.db
      - API_BASE_URL=http://blindtoss.nathangracia.com
      - NEXT_PUBLIC_API_URL=http://blindtoss.nathangracia.com
    volumes:
      - ./public/audio:/app/public/audio
      - ./public/images:/app/public/images
      - ./public/emotes:/app/public/emotes
      - ./prisma:/app/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
