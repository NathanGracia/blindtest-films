services:
  app:
    build: .
    # On ne publie plus le port 3000 vers l'extérieur, Caddy s'en charge en interne
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - DATABASE_URL=file:/app/prisma/prod.db
      - API_BASE_URL=https://blindtest.nathangracia.com # Ton futur lien HTTPS
    volumes:
      - ./public/audio:/app/public/audio
      - ./public/images:/app/public/images
      - ./prisma:/app/prisma
    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: